name: Daily Stock Briefing

on:
  schedule:
    # 22:10 UTC 월~금 = 화~토 07:10 KST — 직전 밤 미국장 세션이 있는 날만.
    # 정각 혼잡을 피하고 한국장 스냅샷과 분 단위를 분리한다.
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      alerts: ${{ steps.health.outputs.alerts }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: "pip"

      # 버전은 고정하지 않는다(yfinance는 Yahoo 변경을 따라가야 하므로 최신 유지). 대신 PyPI 지연·타임아웃에
      # 재시도하고, 컴파일이 필요한 패키지는 휠만 받게 해 소스 빌드(→ 빌드 실패)로 빠지는 경로를 막는다.
      - name: Install Python deps
        if: github.event_name != 'push'
        run: |
          for i in 1 2 3; do
            pip install --prefer-binary --only-binary=numpy,pandas,lxml,curl-cffi,pyyaml \
              --retries 5 --timeout 60 -r requirements.txt && break
            [ "$i" = 3 ] && exit 1
            echo "pip 설치 실패 — 20초 후 재시도 $i/3"; sleep 20
          done

      - name: Fetch market data
        if: github.event_name != 'push'
        run: python scripts/fetch_data.py

      - name: Generate briefing
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate.py

      - name: Generate current weekly and monthly reviews
        if: github.event_name != 'push'
        run: python scripts/generate_reviews.py

      # '사람 조치 필요' 상태만 골라 출력한다(항상 성공). 실제 실패 알림은 마지막 alert job이 배포 뒤에 낸다.
      - name: Health check (human-action alerts)
        id: health
        if: github.event_name != 'push'
        run: python scripts/health_check.py

      - name: Commit briefing, data, event ledger and reviews
        if: github.event_name != 'push'
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add briefings reviews site/src/data/history.json site/src/data/series.json site/src/data/sentiment.json site/src/data/news.json site/src/data/event_ledger.json site/src/data/quality.json
          git diff --cached --quiet || git commit -m "briefing: $(date -u -d '+9 hours' +'%Y-%m-%d')"
          ok=""
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { ok=1; break; }
            echo "push 충돌/실패 — 재시도 $i/5"; sleep 6
          done
          [ -n "$ok" ] || { echo "push 최종 실패 — 브리핑 커밋 유실 위험"; exit 1; }

  # 데이터 수집·LLM 분석은 서로 막지 않는다. Pages 업로드만 공통 대기열에서 직렬화한다.
  # 이 job은 실행 시작 시 최신 main을 다시 checkout하므로, 대기 중 더 새 데이터가 push되어도
  # 오래된 workflow SHA를 배포하지 않는다.
  deploy:
    needs: briefing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          SITE_URL: "https://${{ github.repository_owner }}.github.io"
        run: |
          cd site
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: 배포 재시도 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (재시도)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

  # 사람이 조치해야 하는 상태(LLM 키 인증 실패·쓸 수 있는 모델 없음·키 미설정, 시세 그룹 3일 연속 0건)만
  # 커밋·배포가 끝난 뒤 이 job을 실패시켜 GitHub 실패 메일로 알린다. 일시 오류(429/5xx, 하루짜리 누락)는
  # health_check가 거르므로 여기까지 오지 않는다. 배포 결과와 무관하게(배포를 막지 않고) 마지막에 실행.
  alert:
    needs: [briefing, deploy]
    if: ${{ !cancelled() && needs.briefing.outputs.alerts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 사람 조치 필요 알림
        env:
          ALERTS: ${{ needs.briefing.outputs.alerts }}
        run: |
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error title=사람 조치 필요::$line"
          done <<< "$ALERTS"
          exit 1
