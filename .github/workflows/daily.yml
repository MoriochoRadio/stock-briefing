name: Daily Stock Briefing

on:
  schedule:
    # 22:10 UTC 월~금 = 화~토 07:10 KST — 직전 밤 미국장 세션이 있는 날만.
    # 정각 혼잡을 피하고 한국장 스냅샷과 분 단위를 분리한다.
    - cron: "10 22 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: Fetch market data
        if: github.event_name != 'push'
        run: python scripts/fetch_data.py

      - name: Generate briefing
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate.py

      - name: Commit briefing, data and quality metadata
        if: github.event_name != 'push'
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add briefings site/src/data/history.json site/src/data/series.json site/src/data/sentiment.json site/src/data/news.json site/src/data/quality.json
          git diff --cached --quiet || git commit -m "briefing: $(date -u -d '+9 hours' +'%Y-%m-%d')"
          ok=""
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { ok=1; break; }
            echo "push 충돌/실패 — 재시도 $i/5"; sleep 6
          done
          [ -n "$ok" ] || { echo "push 최종 실패 — 브리핑 커밋 유실 위험"; exit 1; }

  # 데이터 수집·LLM 분석은 서로 막지 않는다. Pages 업로드만 공통 대기열에서 직렬화한다.
  # 이 job은 실행 시작 시 최신 main을 다시 checkout하므로, 대기 중 더 새 데이터가 push되어도
  # 오래된 workflow SHA를 배포하지 않는다.
  deploy:
    needs: briefing
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          SITE_URL: "https://${{ github.repository_owner }}.github.io"
        run: |
          cd site
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 배포 재시도 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (재시도)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
