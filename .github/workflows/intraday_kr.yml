name: Korea Intraday Snapshot

on:
  schedule:
    # 22시 UTC는 모닝 브리핑과 겹치지 않게 비우고, 실제 KST 도착 시각은 스크립트가 판정한다.
    - cron: "*/30 20-21,23 * * 0-4"
    - cron: "*/30 0-14 * * 1-5"
  workflow_dispatch:
    inputs:
      phase:
        description: "점검 시점 (auto=현재 KST로 자동 판정)"
        type: choice
        default: auto
        options: [auto, open, mid, close]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      captured: ${{ steps.snap.outputs.captured }}
      phase: ${{ steps.snap.outputs.phase }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Korea intraday snapshot (auto phase)
        id: snap
        env:
          PYTHONIOENCODING: "utf-8"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/intraday_kr.py "${{ github.event.inputs.phase || 'auto' }}"

      - name: Commit intraday snapshot and data quality metadata
        if: steps.snap.outputs.captured == 'true'
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add site/src/data/intraday.json
          git diff --cached --quiet || git commit -m "intraday(${{ steps.snap.outputs.phase }}): $(date -u -d '+9 hours' +'%Y-%m-%d %H:%M') KST"
          ok=""
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { ok=1; break; }
            echo "push 충돌/실패 — 재시도 $i/5"; sleep 6
          done
          [ -n "$ok" ] || { echo "push 최종 실패 — 스냅샷 커밋 유실 위험"; exit 1; }

  # 스냅샷이 실제로 생성됐을 때만 배포한다. 공통 동시성은 이 짧은 배포 job에만 걸어
  # 30분 주기의 수집·분석 작업이 모닝 브리핑과 서로 대기열에서 취소되지 않게 한다.
  deploy:
    needs: intraday
    if: needs.intraday.outputs.captured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Build Astro site
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
          SITE_URL: "https://${{ github.repository_owner }}.github.io"
        run: |
          cd site
          npm ci
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: 배포 재시도 대기
        if: steps.deploy.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (재시도)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
